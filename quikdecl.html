<!DOCTYPE html>
<html>

<head>
	<script src="./sharedcode/lib-alishortjsfns.js"></script>
	
	<script src="./sharedcode/const-quickdeclmsgs.js"></script>
	<script src="./sharedcode/fn-copy_text.js"></script>
	<script src="./sharedcode/fn-documentfragment_of_eles_from_text_array.js"></script>
	<script>
		const ui = {
			copy_text(ele_) {
				copy_text(ele_);
			}
		};
		
		window.addEventListener("load", (e) => {							
			
			const msgs_arr = quickdeclmsgs.trim().split('\n');

			qs("main-active").append(documentfragment_of_eles_from_text_array(msgs_arr, "p"));
			
			qsa("p").forEach(el => el.addEventListener("click", ev => ui.copy_text(ev.currentTarget)));
	
		} , { once: true }); //cleanup, End window.onload.
		
	</script>
	<style>
		html{
			background-color: black;
			color: white;
		}
		
		body {
			box-sizing: border-box;
			font-size: large;
		}

		
		p:active {
			color: #ff98ef;
			background-color: #472bde;
		}

		p:hover { color: #2392b4; }

		intro-div {
			display: block;
			font-style: italic;
			color: #75c7ae;
			background-color: #18187b;
			width: 100%;
		}
		
		/* desktop only styles */
		@media (width >=1000px) {
			p { 
				padding-left: 1em;
			}
		}
		
		/* phone-only styles */
		@media (width <=1000px) {
			html{
				background-color: black; /* idk why but w/o this bg color ignored on phone */
			}

			body {
				font-size: large;
				color: #00d832;
/*				color: #6e5fc3;*/
/*				font-size: 50px;*/
/*
				margin-right: 5px;
				margin-left: 2px;
*/
			}

			p {
				font-size: large;
				word-break: normal;
				white-space: normal;

/*				font-size: 50px;*/
				
/*				font-size: 50px;*/
/*
				word-break: normal;
				white-space: normal;
*/
			}
		}




	</style>

</head>
<body>
	<intro-div>&gt;&gt;Click a paragraph below to copy</intro-div>
	
	<main-active></main-active>
</body>

</html>
