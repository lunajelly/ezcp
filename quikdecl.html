<!DOCTYPE html>
<html>

<head>
	<style>
		body {
			background-color: black;
			color: white;
			box-sizing: border-box;
			margin-left: 2em;
		}

		p { width: 100%; }
		
		p:active {
			color: #ff98ef;
			background-color: #472bde;
		}

		p:hover { color: #2392b4; }

		intro-div {
			display: block;
			font-style: italic;
			color: #80f2cf;
			background-color: #18187b;
			font-style: italic;
			width: 100%;
		}

	</style>
	
	<script src="ali-util.js"></script>
	<script src="quickdecl-msgs.js"></script>
	<script>		
		
		const ui = {
			//copy output link on click
			copyOutputLink(ele) {
				l("foo");
				let copyText = ele.textContent;
				navigator.clipboard.writeText(copyText)
				      .then(() => {
					l("successfully copied");
				})
					.catch(() => {
					l("something went wrong");
				});
			}
		};
		
		window.addEventListener("load", (event) => {
				
				l("oo");
			//const msgs from quickdecl_msgs.js
			const msgs_arr = msgs.trim().split('\n');
			
			const fragment = document.createDocumentFragment();
			
			for (const msg of msgs_arr) {
				const p = document.createElement("p");
				p.textContent = msg;
				p.tabIndex = 0;
				p.onclick = ui.copyOutputLink(this);
				fragment.append(p);
			}
			qs("main").append(fragment);
			
			qsa("p").forEach(ele => ele.addEventListener("click", ev => ui.copyOutputLink(ev.currentTarget)));
		} , {
				once: true //cleanup
			}); //End window.onload.
		
			l("o");
	</script>

</head>
<body>
	<intro-div>>>Click a paragraph below to copy</intro-div>
	
	<main>
	</main>

</body>

</html>
