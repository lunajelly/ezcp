<!DOCTYPE html>
<html>

<head>
	<script src="ali-util.js"></script>
	<script src="quickdecl-msgs.js"></script>
	<script>		
		
		const ui = {
			async copyText(ele) {
				let text = ele.textContent;
				await navigator.clipboard.writeText(text);
			}
		};
		
		window.addEventListener("load", (e) => {		
							
			const fragment = document.createDocumentFragment();
			
			//const msgs from quickdecl_msgs.js
			const msgs_arr = msgs.trim().split('\n');
			
			msgs_arr.forEach(msg => {
				const p = document.createElement("p");
				p.textContent = msg;
				p.tabIndex = 0; //SR access
				fragment.append(p);
				});
			
			qs("main-active").append(fragment);
			
			qsa("p").forEach(el => el.addEventListener("click", ev => ui.copyText(ev.currentTarget)));
	
		} , { once: true }); //cleanup, End window.onload.
		
	</script>
	<style>
		html{
			background-color: black;
			color: white;
		}
		
		body {
			box-sizing: border-box;
		}

		p { 
			width: 100%; 
			padding-left: 1em;

		}
		
		p:active {
			color: #ff98ef;
			background-color: #472bde;
		}

		p:hover { color: #2392b4; }

		intro-div {
			display: block;
			font-style: italic;
			color: #75c7ae;
			background-color: #18187b;
			width: 100%;
		}
		
		/* phone-only styles */
		@media (width <=1000px) {
			html{
				background-color: black; /* idk why but w/o this bg color ignored on phone */
			}

			body {
				color: #472bde;
				font-size: 50px;
				margin-right: 5px;
				margin-left: 5px;
			}

			p {
				word-break: normal;
				white-space: normal;
			}
		}


	</style>

</head>
<body>
	<intro-div>>>Click a paragraph below to copy</intro-div>
	
	<main-active></main-active>
</body>

</html>
